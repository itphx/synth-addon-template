# Пример Kubernetes Secret с installer-ключом авто-установки — обычный манифест (НЕ Helm-шаблон).
#
# Имя Secret указывается в чарте как `autoInstall.installerSecretName`,
# ключ — `autoInstall.installerSecretKey` (по умолчанию `token`). Hook-Job
# подставляет значение в env `SYNTH_INSTALL_TOKEN` через secretKeyRef.
#
#   kubectl -n synth apply -f examples/installer-secret.yaml
#   helm install synth-addon charts/synth-addon \
#     --set autoInstall.enabled=true \
#     --set autoInstall.url=http://synth-backend.synth.svc.cluster.local:5000/api/v2 \
#     --set autoInstall.installerSecretName=synth-addon-installer
#
# Что за ключ: scoped-ключ инстанса Synth (AD-052) для машинной установки
# MCP-серверов и скиллов (целевой скоуп — `addons:install`; сейчас нужна роль
# ADMIN, см. docs/deployment.md). Секрет отдаётся один раз при создании ключа —
# храните его здесь и не коммитьте. В проде используйте SealedSecret/внешний
# секрет-менеджер, а не этот файл.
apiVersion: v1
kind: Secret
metadata:
  name: synth-addon-installer
type: Opaque
stringData:
  # Значение: `synth_svc_…` или API-ключ инстанса. Замените на реальный.
  token: "REPLACE_ME"
