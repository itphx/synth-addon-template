# Пример Kubernetes Secret с секретами add-on'а — обычный манифест (НЕ Helm-шаблон).
#
# Применяется отдельно от чарта, имя указывается в `existingSecret` чарта:
#   kubectl -n synth apply -f examples/secret.yaml
#   helm install synth-addon charts/synth-addon --set existingSecret=synth-addon-secrets
#
# Значения из примера замените на реальные; секреты в git не хранить.
# В проде используйте SealedSecret/внешний секрет-менеджер, а не этот файл.
apiVersion: v1
kind: Secret
metadata:
  name: synth-addon-secrets
type: Opaque
stringData:
  # Bearer-токен API (SYNTH_ADDON_TOKEN). Замените на реальный.
  SYNTH_ADDON_TOKEN: "REPLACE_ME"
  # URL egress-прокси, если требуется (SYNTH_ADDON_PROXY_URL).
  SYNTH_ADDON_PROXY_URL: ""
