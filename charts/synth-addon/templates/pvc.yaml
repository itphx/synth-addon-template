{{- if and .Values.service.enabled .Values.persistence.enabled }}
# PVC для JSON-хранилища add-on'а (создаётся при service.enabled и persistence.enabled).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "synth-addon.fullname" . }}
  labels:
    {{- include "synth-addon.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
