{{- if .Values.service.enabled }}
# Service сервиса-надстройки: ClusterIP c портом сервиса (+ порт MCP, если задан).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synth-addon.fullname" . }}
  labels:
    {{- include "synth-addon.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.service.mcpPort }}
    - name: mcp
      port: {{ .Values.service.mcpPort }}
      targetPort: mcp
      protocol: TCP
    {{- end }}
  selector:
    {{- include "synth-addon.selectorLabels" . | nindent 4 }}
{{- end }}
